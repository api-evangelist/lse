apis:
- aid: lse:identity-federation
  name: LSE Shibboleth Identity Provider (UK Access Management Federation)
  x-operator: institution
  description: >-
    LSE operates its own SAML2 Shibboleth identity provider for staff, students and library resource access,
    registered in the UK Access Management Federation under entityID https://lse.ac.uk/idp with the scope
    lse.ac.uk. The IdP metadata is published as machine-readable XML and returned 200 on 2026-08-19, listing
    HTTP-Redirect, HTTP-POST and HTTP-POST-SimpleSign SSO bindings plus SAML1 and SAML2 SOAP artifact
    resolution on port 8443. This is the clearest institution-operated programmable surface LSE has —
    identity federation is institution-operated by definition. One published Location is malformed (gate.library.lse.ac.uk.lse.ac.uk,
    NXDOMAIN); a second LSE entity registered at idp.lse.ac.uk self-labels "Test IdP - DO NOT USE" and
    is not recorded here.
  humanURL: https://www.lse.ac.uk/
  baseURL: https://gate.library.lse.ac.uk/idp/shibboleth
