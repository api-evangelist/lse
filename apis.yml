description: >-
  The London School of Economics and Political Science (LSE) is a public research
  university in London, United Kingdom, a member of the Russell Group and the
  University of London, ranked in the QS World University Rankings top 40 and
  specialised in the social sciences. LSE operates no public developer portal, no
  open data portal, no course-catalog or timetable API, and no official GitHub
  organisation — github.com/lse is an unrelated systems-programming lab. Re-profiled
  on 2026-08-19 against the operator axis, its genuinely institution-operated
  machine-readable footprint is two things: a SAML2 Shibboleth identity provider
  registered in the UK Access Management Federation under entityID
  https://lse.ac.uk/idp, and an IMS LTI 1.3 platform on its own Moodle VLE serving a
  live JWKS, OAuth 2.0 token endpoint and OIDC authorization endpoint. Everything
  else that appears to be an LSE API is a vendor contract running under an LSE
  tenancy — EPrints Services hosts the research repository, Ex Libris Primo VE the
  library discovery layer, Quartex the digital library, Epexio the archive catalogue,
  and DataCite the DOI registration. Those tenancies are real institutional facts and
  are recorded as such; the contracts behind them belong to the vendors, not to LSE.
