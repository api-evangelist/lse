  detail: >-
    LSE was fully probed on 2026-08-19 and the profile is thin because the
    institution is thin, not because the probe failed. Twelve candidate hosts were
    resolved and fetched: api., data., developer. and opendata.lse.ac.uk do not
    exist (NXDOMAIN); www.lse.ac.uk publishes no llms.txt and no security.txt; there
    is no course-catalog or timetable API behind the programme search; there is no
    official GitHub organisation. Two institution-operated surfaces were found and
    verified live — the Shibboleth IdP and the Moodle LTI 1.3 platform — and five
    vendor tenancies were confirmed by DNS CNAME or platform fingerprint. Two
    negative findings are recorded deliberately: LSE's UKAMF-published
    POST-SimpleSign SSO endpoint has a doubled host that does not resolve, and a
    second LSE federation entity self-labels "Test IdP - DO NOT USE" and is excluded
    from the surface inventory as a placeholder. The EPrints search and export
    endpoints are behind a Cloudflare challenge and Apache auth respectively — live
    but not readable, which is a gate, not an absence.
