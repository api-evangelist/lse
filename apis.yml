  name: LSE DOI Registration (DataCite)
  x-operator: tenant
  description: >-
    LSE is a registered DataCite provider — member identifier lcqr, "London School of Economics", memberType
    consortium_organization, region EMEA, registered 2020-09-01, linked to ROR https://ror.org/0090zs177.
    Three repositories mint DOIs under it: bl.lse (institutional), lcqr.lsedl (LSE Digital Library) and
    lcqr.plmezb (Houghton St Press). The registration and the minted identifiers are LSE's; the API that
