aid: lse
name: London School of Economics and Political Science
description: >-
  The London School of Economics and Political Science (LSE) is a public research
  university in London, United Kingdom, ranked #38 in the QS World University Rankings
  2025 and renowned for the social sciences. LSE does not operate a unified public
  developer portal. Its confirmed public, machine-readable footprint centers on
  library and open-research infrastructure: the LSE Research Online institutional
  repository (EPrints) exposes metadata via OAI-PMH, the LSE Digital Library (Quartex)
  offers IIIF manifests and OAI-PMH harvesting on request, and discovery runs on
  Ex Libris Alma/Primo. Identity for student/staff systems is federated via SAML2
  (Shibboleth / UK Access Management Federation). Most administrative and student
  APIs are gated behind institutional credentials rather than openly documented.
