- aid: lse:digital-library
  name: LSE Digital Library (Quartex — IIIF / OAI-PMH)
  x-operator: tenant
  description: >-
    The LSE Digital Library publishes digitised and born-digital material from LSE Library collections.
    The host CNAMEs to lse.custom.url.quartexcollections.com, an LSE tenancy on Adam Matthew Digital's
    Quartex platform, and all assets and service endpoints resolve to *.quartexcollections.com. The About
    page states IIIF manifests are available per item and that metadata can be downloaded at scale via
    OAI-PMH, directing large-scale users to library.enquiries@lse.ac.uk. No OAI-PMH base URL is published
    — /oai and /OAI on this host return the site's SPA shell with HTTP 200, which is a soft-404, not an
    endpoint. The collection is LSE's; the platform, the manifests and the APIs are Quartex's.
