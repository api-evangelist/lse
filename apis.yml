- aid: lse:research-online-oai
  name: LSE Research Online (EPrints, OAI-PMH)
  x-operator: tenant
  description: >-
    LSE Research Online is LSE's institutional repository — LSE's research outputs, LSE's metadata, LSE's
    registered OAI-PMH base URL and admin contact (lseresearchonline@lse.ac.uk). It is not LSE's engineering:
    the host CNAMEs to lse-eprints-cs.com, EPrints Services' managed hosting, and the software self-reports
    as EPrints 3.4.6. The OAI-PMH 2.0 interface returned a valid Identify response on 2026-08-19 (it was
    returning HTTP 500 at the June 2026 review and has since recovered), with deletedRecord=persistent
    and earliestDatestamp 2010-10-01. Item-level export returns 401 and the search endpoint is behind
    a Cloudflare challenge. The Identify response still carries EPrints' default unconfigured rights text,
    so harvesters are told to assume no rights are granted.
  humanURL: https://researchonline.lse.ac.uk/
  baseURL: https://researchonline.lse.ac.uk/cgi/oai2
