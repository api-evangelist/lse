- date: '2026-08-19'
  rating: 3
  summary: 'University-pipeline re-profile against the operator axis. The June 2026 review was honest
    about absence but had not settled WHO OPERATES each surface, and it attributed Ex Libris library discovery
    to www.lse.ac.uk. Corrected: LSE has exactly two institution-operated machine-readable surfaces, both
    verified live. (1) A SAML2 Shibboleth identity provider, entityID https://lse.ac.uk/idp, registered
    in the UK Access Management Federation, metadata served at https://gate.library.lse.ac.uk/idp/shibboleth
    (200, application/xml, shibmd:Scope lse.ac.uk). (2) An IMS LTI 1.3 platform on LSE''s own Moodle —
    live JWKS, OAuth 2.0 client-credentials token endpoint and OIDC authorization endpoint, issuer https://moodle.lse.ac.uk,
    technical contact lti.support@lse.ac.uk. Five surfaces are LSE tenancies on vendor platforms and are
    recorded as tenant, not institution: EPrints Services (researchonline.lse.ac.uk CNAMEs lse-eprints-cs.com),
    Ex Libris Primo VE (librarysearch.lse.ac.uk CNAMEs lse.primo.exlibrisgroup.com, vid=44LSE_INST), Quartex
    (digital.library.lse.ac.uk CNAMEs quartexcollections.com), Epexio (archives.lse.ac.uk), and DataCite
    (provider lcqr, ROR 0090zs177, three repositories). The OAI-PMH endpoint that returned 500 in June
    now returns a valid Identify (EPrints 3.4.6, deletedRecord=persistent). Two defects found in LSE''s
    own published federation metadata: a POST-SimpleSign SSO Location with a doubled host (gate.library.lse.ac.uk.lse.ac.uk,
    NXDOMAIN), and a stale second entity self-labelled ''Test IdP - DO NOT USE'' at idp.lse.ac.uk, which
    is excluded as a placeholder rather than counted as a surface. Moodle Web Services return HTTP 200
    on authentication failure. Still no developer portal, no open data portal, no course/timetable API,
    no llms.txt, no security.txt on www, and no official GitHub organisation. Five education-regime domain
    standards confirmed with evidence: lti, shibboleth, saml, oai-pmh, datacite. No endpoints fabricated.'
