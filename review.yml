- date: '2026-06-03'
  rating: 2
  summary: 'LSE has no unified public developer portal. The verifiable public footprint is library/open-research
    infrastructure: the LSE Research Online EPrints repository (OAI-PMH base URL registered with re3data/SHERPA/ROAR,
    but the live endpoint returned HTTP 500 during review), the LSE Digital Library on Quartex (IIIF manifests
    and OAI-PMH on request, live and returning 200), and Ex Libris Alma/Primo discovery. Identity is federated
    SAML2 (Moodle SSO live, 200). There is no official LSE GitHub organization — github.com/lse is an
    unrelated systems-programming lab, and the only LSE course/timetable APIs found were third-party community
    projects. No endpoints were fabricated; gated and non-resolving interfaces are flagged honestly.'
